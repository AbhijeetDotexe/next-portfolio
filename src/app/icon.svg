<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121c16" />
      <stop offset="100%" stop-color="#080d0a" />
    </linearGradient>

    <!-- Glowing subtle emerald border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4a37" />
      <stop offset="100%" stop-color="#13231a" />
    </linearGradient>

    <!-- Monogram letters gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e3e9e4" />
    </linearGradient>

    <!-- Emerald brand dot gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ee6a2" />
      <stop offset="100%" stop-color="#2eb87a" />
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Subtle ambient gloss -->
  <path d="M 1 16 C 1 7.7 7.7 1 16 1 L 34 1 C 15 1 1 15 1 34 Z" fill="#ffffff" opacity="0.04" />

  <!-- Monogram Letters "AR" -->
  <g fill="url(#letterGrad)">
    <!-- Letter A -->
    <path d="M 15.6 17 H 19.2 L 27.6 47 H 21.8 L 20.0 40.2 H 14.8 L 13.0 47 H 7.2 Z M 17.4 23.4 L 15.7 34.6 H 19.1 Z" />

    <!-- Letter R -->
    <path d="M 31.6 17 H 42.4 C 47.0 17 50.0 19.8 50.0 24.5 C 50.0 28.4 47.4 31.2 43.8 32.0 L 50.2 47 H 44.0 L 38.2 33.6 H 37.2 V 47 H 31.6 Z M 37.2 22.4 V 28.0 H 42.0 C 43.8 28.0 44.8 27.0 44.8 25.2 C 44.8 23.4 43.8 22.4 42.0 22.4 Z" />
  </g>

  <!-- Signature Emerald Dot with glow -->
  <circle cx="54.4" cy="44.2" r="5.0" fill="#3ecf8e" opacity="0.25" />
  <circle cx="54.4" cy="44.2" r="3.2" fill="url(#emeraldGrad)" />
  <circle cx="54.4" cy="44.2" r="1.3" fill="#a7f3d0" opacity="0.7" />
</svg>
